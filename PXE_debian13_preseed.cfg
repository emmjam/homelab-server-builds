d-i debian-installer/locale string en_GB.UTF-8
d-i keyboard-configuration/xkb-keymap select gb

d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string hp-ai
d-i netcfg/get_domain string lan

d-i clock-setup/utc boolean true
d-i time/zone string Europe/London

d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/non-free-firmware boolean true

d-i passwd/root-login boolean false
d-i passwd/user-fullname string Ian
d-i passwd/username string ian
d-i passwd/user-password-crypted password NP
d-i passwd/user-default-groups string audio cdrom video sudo

d-i partman/early_command string debconf-set partman-auto/disk "$(list-devices disk | head -n1)"
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

d-i apt-setup/cdrom/set-first boolean false
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string sudo openssh-server curl wget
d-i pkgsel/upgrade select safe-upgrade

d-i preseed/late_command string in-target /bin/sh -c 'install -d -m 700 -o ian -g ian /home/ian/.ssh && printf "%s\n" "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHpT3hhS4RJ9pYhmAbwGZ+t9G4z0ULd+/8nkgef3b4q/ ian@Laptop" > /home/ian/.ssh/authorized_keys && chown ian:ian /home/ian/.ssh/authorized_keys && chmod 600 /home/ian/.ssh/authorized_keys && printf "%s\n" "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHpT3hhS4RJ9pYhmAbwGZ+t9G4z0ULd+/8nkgef3b4q/ ian@Laptop" > /tmp/rundeck.pub && chmod 644 /tmp/rundeck.pub && curl -fsSL https://raw.githubusercontent.com/emmjam/homelab-server-builds/main/scripts/debian-baseline.sh -o /root/debian-baseline.sh && chmod 700 /root/debian-baseline.sh && /root/debian-baseline.sh > /root/debian-baseline.log 2>&1 && printf "%s\n" "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHpT3hhS4RJ9pYhmAbwGZ+t9G4z0ULd+/8nkgef3b4q/ ian@Laptop" > /home/rundeck/.ssh/authorized_keys && chown rundeck:rundeck /home/rundeck/.ssh/authorized_keys && chmod 600 /home/rundeck/.ssh/authorized_keys'

d-i finish-install/reboot_in_progress note