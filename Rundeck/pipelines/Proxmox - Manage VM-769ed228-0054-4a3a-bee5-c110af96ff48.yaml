- defaultTab: nodes
  description: 'Create or delete a Proxmox VM. Choose create to refresh and deploy scripts, then clone the Debian template. Choose delete to remove the exact VM name or numeric ID. Create assigns the lowest available VM ID; template VMs are protected from deletion.'
  executionEnabled: true
  id: 769ed228-0054-4a3a-bee5-c110af96ff48
  loglevel: INFO
  name: Proxmox - Manage VM
  nodeFilterEditable: false
  options:
  - description: Choose whether to create a VM or delete an existing VM.
    enforced: true
    label: Action
    name: action
    required: true
    values:
    - create
    - delete
  - description: Hostname for a VM being created.
    label: VM name (create)
    name: vmname
    required: false
    type: text
  - description: Number of virtual CPU cores for a VM being created.
    label: CPU cores (create)
    name: cores
    required: false
    type: text
  - description: VM RAM size in whole GB for a VM being created.
    label: RAM (GB) (create)
    name: memory
    required: false
    type: text
  - description: VM disk size in whole GB for a VM being created.
    label: Disk size (GB) (create)
    name: disk
    required: false
    type: text
  - description: Exact VM name or numeric Proxmox VM ID to delete. Template VMs cannot be deleted.
    label: VM name or ID (delete)
    name: target
    required: false
    type: text
  plugins:
    ExecutionLifecycle: {}
  scheduleEnabled: false
  sequence:
    commands:
    - description: Run creation workflow when action is create
      type: conditional
      nodeStep: false
      invertLogic: false
      conditionGroups:
      - - key: "${option.action}"
          operator: "=="
          value: create
      subSteps:
      - description: Refresh Rundeck job definitions from Git
        jobref:
          group: jobs
          name: HomeLab - Update GitHub Checkout
          nodeStep: false
          project: HomeLab
          uuid: 310dfa4f-e27f-4945-be6a-7380ef75e586
      - description: Deploy build scripts to TNAS
        jobref:
          group: jobs
          name: HomeLab - Deploy Build Scripts to TNAS
          nodeStep: false
          project: HomeLab
          uuid: 51192072-1984-48dd-9fe8-88d78c339b31
      - description: Clone VM from the Debian template
        jobref:
          args: "-vmname '${option.vmname}' -cores ${option.cores} -memory ${option.memory} -disk ${option.disk}"
          group: jobs
          name: Proxmox - Clone VM
          nodeStep: false
          project: HomeLab
          uuid: 5c7a2428-7407-43cd-90ff-886e5f5447dd
    - description: Run deletion when action is delete
      type: conditional
      nodeStep: false
      invertLogic: false
      conditionGroups:
      - - key: "${option.action}"
          operator: "=="
          value: delete
      subSteps:
      - description: Delete VM by exact name or numeric ID
        jobref:
          args: "-target '${option.target}'"
          group: jobs
          name: Proxmox - Delete VM
          nodeStep: false
          project: HomeLab
          uuid: 4eb507e0-9514-4cf2-babc-347df5faf73c
    keepgoing: false
    strategy: node-first
  user: ian
  uuid: 769ed228-0054-4a3a-bee5-c110af96ff48
  group: pipelines
