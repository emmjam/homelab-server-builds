- defaultTab: nodes
  description: Create or delete a Proxmox VM by invoking the existing Rundeck jobs. Creation refreshes the checkout and deploys scripts before cloning; deletion calls the protected delete job directly.
  executionEnabled: true
  id: 769ed228-0054-4a3a-bee5-c110af96ff48
  loglevel: INFO
  name: Proxmox - Manage VM
  nodeFilterEditable: false
  nodefilters:
    dispatch:
      keepgoing: false
      threadcount: 1
    filter: "name: localhost"
  options:
  - hidden: true
    name: rundeck_api_token
    required: true
    secure: true
    valueExposed: true
    storagePath: keys/project/HomeLab/rundeck_api_token
    type: text
  - description: Choose whether to create a VM or delete an existing VM.
    enforced: true
    label: Action
    name: action
    required: true
    values:
    - create
    - delete
  - description: Hostname for a VM being created.
    label: VM name (create)
    name: vmname
    required: false
    type: text
  - description: Number of virtual CPU cores for a VM being created.
    label: CPU cores (create)
    name: cores
    required: false
    type: text
  - description: VM RAM size in whole GB for a VM being created.
    label: RAM (GB) (create)
    name: memory
    required: false
    type: text
  - description: VM disk size in whole GB for a VM being created.
    label: Disk size (GB) (create)
    name: disk
    required: false
    type: text
  - description: Exact VM name or numeric Proxmox VM ID to delete. Template VMs cannot be deleted.
    label: VM name or ID (delete)
    name: target
    required: false
    type: text
  plugins:
    ExecutionLifecycle: {}
  scheduleEnabled: false
  sequence:
    commands:
    - description: Validate the action and run the matching Rundeck job sequence
      scriptfile: /opt/homelab-server-builds/Rundeck/scripts/manage-vm-pipeline.sh
      scriptInterpreter: /bin/bash
    keepgoing: false
    strategy: node-first
  user: ian
  uuid: 769ed228-0054-4a3a-bee5-c110af96ff48
  group: pipelines
