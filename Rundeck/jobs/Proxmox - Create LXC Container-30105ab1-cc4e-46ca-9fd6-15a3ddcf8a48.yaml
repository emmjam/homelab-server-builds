- defaultTab: output
  description: LXC lifecycle automation from Git; validates all parameters on TNAS
    before changes.
  executionEnabled: true
  group: jobs
  id: 30105ab1-cc4e-46ca-9fd6-15a3ddcf8a48
  loglevel: INFO
  name: Proxmox - Create LXC Container
  nodeFilterEditable: false
  options:
  - name: id
    required: true
    regex: '[1-9][0-9]{2,5}'
  - name: hostname
    required: true
    regex: '[a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?'
  - name: cores
    required: true
    value: '2'
    regex: '[1-9][0-9]{0,5}'
  - name: memory
    required: true
    value: '1'
    regex: '[1-9][0-9]{0,5}'
    description: Whole GB of RAM
  - name: disk
    required: true
    value: '8'
    regex: '[1-9][0-9]{0,5}'
    description: Whole GB; cannot shrink below template size
  - name: storage
    required: true
    value: local-zfs
    regex: '[a-zA-Z0-9][a-zA-Z0-9_-]{0,62}'
  - name: bridge
    required: true
    value: vmbr0
    regex: '[a-zA-Z0-9][a-zA-Z0-9_-]{0,62}'
  - name: ip
    required: true
    value: dhcp
    regex: dhcp|([0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,2}
  - name: gateway
    required: false
    regex: ([0-9]{1,3}\.){3}[0-9]{1,3}
  - name: dns
    required: true
    value: 192.168.0.2
    regex: '[0-9a-fA-F:. ]+'
  - name: search_domain
    value: lan
    required: false
    regex: '[a-zA-Z0-9.-]+'
  - name: template_id
    required: true
    value: '9001'
    regex: '[1-9][0-9]{2,5}'
  - name: ssh_public_key
    required: false
    description: Optional single OpenSSH public key for root; no private keys. Without
      a key use pct console access.
  scheduleEnabled: false
  sequence:
    commands:
    - jobref:
        group: jobs
        name: HomeLab - Update GitHub Checkout
        nodeStep: false
        project: HomeLab
        uuid: 310dfa4f-e27f-4945-be6a-7380ef75e586
    - jobref:
        group: jobs
        name: HomeLab - Deploy Build Scripts to TNAS
        nodeStep: false
        project: HomeLab
        uuid: 51192072-1984-48dd-9fe8-88d78c339b31
    - scriptfile: /opt/homelab-server-builds/Rundeck/scripts/invoke-lxc.sh
      args: create
    keepgoing: false
    strategy: node-first
  user: ian
  uuid: 30105ab1-cc4e-46ca-9fd6-15a3ddcf8a48
