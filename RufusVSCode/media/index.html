<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{CSP}}; script-src 'nonce-{{NONCE}}'; connect-src 'none'; img-src 'none'; base-uri 'none'; form-action 'none'"><link rel="stylesheet" href="{{STYLE}}"><script nonce="{{NONCE}}" src="{{SCRIPT}}" defer></script><title>Rufus</title></head><body>
<header><strong>Rufus</strong><select id="conversations" aria-label="Saved conversations"><option value="">New conversation</option></select><button data-command="new" title="New conversation" aria-label="New conversation">＋</button><details class="menu"><summary aria-label="Chat options">⋯</summary><div><span id="connection">Signed out</span><button id="login" data-command="login">Sign in</button><button id="logout" data-command="logout" hidden>Sign out</button><button data-command="refresh">Refresh</button><button data-command="operation">Approved operations…</button></div></details></header>
<p id="error" role="alert" hidden></p><main id="transcript" aria-label="Conversation"><section id="messages"></section><section id="actions" aria-label="Operation approvals"></section><details id="activity" hidden><summary>Operations and activity</summary><section id="events"></section><section id="executions"></section></details><p id="welcome">Start a conversation with Rufus.</p></main>
<footer><p id="progress" role="status" aria-live="polite"></p><section id="attachment" hidden><div><strong>Repository context</strong><button data-command="clearContext" aria-label="Remove attached context">×</button></div><details><summary id="context-summary">Review selected context</summary><pre id="context"></pre></details><small>Separate context budget; Rufus may shorten or omit this excerpt to preserve your message and recent history.</small></section><form id="composer"><label class="sr-only" for="message">Message Rufus</label><textarea id="message" rows="3" placeholder="Message Rufus…" required></textarea><div class="composer-tools"><button type="button" data-command="attach" title="Attach selection or file context">＋ Context</button><small id="budget"></small><button id="send" type="submit">Send ↑</button></div></form><small class="hint">Enter to send · Shift+Enter for a new line</small></footer></body></html>
