---
- name: Require Debian 13
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == 'Debian'
      - ansible_facts.distribution_major_version == '13'

- name: Configure APT proxy and direct HTTPS
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/02homelab-proxy
    content: |
      Acquire::http::Proxy "{{ debian_lxc_http_proxy }}";
      Acquire::https::Proxy "DIRECT";
    owner: root
    group: root
    mode: '0644'

- name: Update Debian packages
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    upgrade: dist

- name: Install baseline administration packages
  ansible.builtin.apt:
    name: '{{ debian_lxc_packages }}'
    state: present

- name: Create Ian administrative account as in the VM template
  ansible.builtin.user:
    name: ian
    comment: Ian
    shell: /bin/bash
    groups: sudo
    append: true
    create_home: true
    password: NP
    state: present

- name: Create Ian SSH directory
  ansible.builtin.file:
    path: /home/ian/.ssh
    state: directory
    owner: ian
    group: ian
    mode: '0700'

- name: Authorise Ian laptop public key
  ansible.builtin.copy:
    dest: /home/ian/.ssh/authorized_keys
    content: "{{ debian_lxc_ian_public_key }}\n"
    owner: ian
    group: ian
    mode: '0600'

- name: Read template default editor
  ansible.builtin.command: update-alternatives --query editor
  register: debian_lxc_editor
  changed_when: false

- name: Set template default editor to vi as in the VM template
  ansible.builtin.command: update-alternatives --set editor /usr/bin/vim.tiny
  when: "'Value: /usr/bin/vim.tiny' not in debian_lxc_editor.stdout_lines"
  changed_when: true

- name: Create Rundeck deployment account
  ansible.builtin.user:
    name: rundeck
    shell: /bin/bash
    create_home: true
    state: present

- name: Create Rundeck SSH directory
  ansible.builtin.file:
    path: /home/rundeck/.ssh
    state: directory
    owner: rundeck
    group: rundeck
    mode: '0700'

- name: Authorise the existing Rundeck deployment key
  ansible.builtin.copy:
    dest: /home/rundeck/.ssh/authorized_keys
    content: "{{ debian_lxc_rundeck_public_key }}\n"
    owner: rundeck
    group: rundeck
    mode: '0600'

- name: Allow Ansible deployment through Rundeck inside this guest
  ansible.builtin.copy:
    dest: /etc/sudoers.d/rundeck
    content: "rundeck ALL=(ALL:ALL) NOPASSWD: ALL\n"
    owner: root
    group: root
    mode: '0440'
    validate: /usr/sbin/visudo -cf %s

- name: Enable UTF-8 locale
  ansible.builtin.lineinfile:
    path: /etc/locale.gen
    regexp: '^#?\s*{{ debian_lxc_locale | regex_escape }} UTF-8$'
    line: '{{ debian_lxc_locale }} UTF-8'
  notify: Generate locale

- name: Set default locale
  ansible.builtin.copy:
    dest: /etc/default/locale
    content: "LANG={{ debian_lxc_locale }}\n"
    owner: root
    group: root
    mode: '0644'

- name: Set timezone
  ansible.builtin.file:
    src: '/usr/share/zoneinfo/{{ debian_lxc_timezone }}'
    dest: /etc/localtime
    state: link
    force: true

- name: Record timezone
  ansible.builtin.copy:
    dest: /etc/timezone
    content: "{{ debian_lxc_timezone }}\n"
    owner: root
    group: root
    mode: '0644'

- name: Configure SSH with key authentication only
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-homelab-hardening.conf
    content: |
      PermitRootLogin no
      PubkeyAuthentication yes
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      X11Forwarding no
    owner: root
    group: root
    mode: '0644'
  notify: Restart SSH

- name: Install clone identity initialization
  ansible.builtin.copy:
    src: homelab-lxc-identity.service
    dest: /etc/systemd/system/homelab-lxc-identity.service
    owner: root
    group: root
    mode: '0644'
  register: debian_lxc_identity_unit

- name: Enable clone identity initialization
  ansible.builtin.systemd_service:
    name: homelab-lxc-identity.service
    enabled: true
    daemon_reload: '{{ debian_lxc_identity_unit.changed }}'

- name: Enable daily security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode: '0644'

- name: Disable SSH socket activation
  ansible.builtin.systemd_service:
    name: ssh.socket
    enabled: false
    state: stopped
  notify: Restart SSH

- name: Enable baseline services
  ansible.builtin.systemd_service:
    name: '{{ item }}'
    enabled: true
    state: started
  loop:
    - ssh.service
    - apt-daily.timer
    - apt-daily-upgrade.timer

- name: Validate SSH configuration
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false
