---
- name: Install and configure the homelab APT cache
  hosts: apt_cache
  become: true
  gather_facts: true
  pre_tasks:
    - name: Require Debian 13
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'Debian'
          - ansible_facts.distribution_major_version == '13'

    - name: Use direct repositories on the cache server
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/02homelab-proxy
        owner: root
        group: root
        mode: '0644'
        content: |
          Acquire::http::Proxy "DIRECT";
          Acquire::https::Proxy "DIRECT";

  tasks:
    - name: Install apt-cacher-ng
      ansible.builtin.apt:
        name: [apt-cacher-ng, cron]
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Configure cache listener
      ansible.builtin.blockinfile:
        path: /etc/apt-cacher-ng/acng.conf
        marker: '# {mark} ANSIBLE MANAGED HOMELAB CACHE'
        block: |
          Port: 3142
          BindAddress: 0.0.0.0
          ExThreshold: 4
      notify: Restart APT cache

    - name: Enable and start APT cache
      ansible.builtin.systemd_service:
        name: apt-cacher-ng
        enabled: true
        state: started

    - name: Enable daily package expiration through Debian cron
      ansible.builtin.systemd_service:
        name: cron
        enabled: true
        state: started

    - name: Verify Debian expiration job is installed
      ansible.builtin.command: test -x /etc/cron.daily/apt-cacher-ng
      changed_when: false

    - name: Install cache disk monitor
      ansible.builtin.copy:
        dest: /usr/local/sbin/apt-cache-disk-monitor
        owner: root
        group: root
        mode: '0755'
        content: |
          #!/usr/bin/python3
          import shutil
          import sys
          usage = shutil.disk_usage('/var/cache/apt-cacher-ng')
          percent = usage.used * 100 / usage.total
          level = 'CRITICAL' if percent >= 90 else 'WARNING' if percent >= 80 else 'OK'
          print(f'{level}: APT cache filesystem {percent:.1f}% used; {usage.free // (1024 ** 3)} GiB free', flush=True)
          sys.exit(1 if percent >= 90 else 0)

    - name: Install cache disk monitor service
      ansible.builtin.copy:
        dest: /etc/systemd/system/apt-cache-disk-monitor.service
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Check APT cache filesystem usage (warning 80%, critical 90%)
          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/apt-cache-disk-monitor
          StandardOutput=journal
          StandardError=journal

    - name: Install hourly cache disk monitor timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/apt-cache-disk-monitor.timer
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Monitor APT cache disk usage hourly
          [Timer]
          OnBootSec=5min
          OnUnitActiveSec=1h
          [Install]
          WantedBy=timers.target

    - name: Enable hourly disk monitoring
      ansible.builtin.systemd_service:
        name: apt-cache-disk-monitor.timer
        daemon_reload: true
        enabled: true
        state: started

    - name: Run initial disk check
      ansible.builtin.command: /usr/local/sbin/apt-cache-disk-monitor
      changed_when: false

    - name: Apply pending cache configuration
      ansible.builtin.meta: flush_handlers

    - name: Verify cache listener
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 3142
        timeout: 15

  handlers:
    - name: Restart APT cache
      ansible.builtin.systemd_service:
        name: apt-cacher-ng
        state: restarted
