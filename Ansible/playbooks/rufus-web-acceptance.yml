---
- name: Verify trusted LAN Web and loopback API isolation
  hosts: rufus
  become: true
  gather_facts: false
  tags: [web_isolation]
  tasks:
    - name: Verify binding, firewall, identity and protected files
      ansible.builtin.shell: |
        set -eu
        python3 - <<'PY'
        import json,pathlib,subprocess,urllib.request,urllib.error
        c=json.load(open('/opt/rufus-web/config/config.json'))
        for port,address in ((8787,'127.0.0.1'),(8788,c['bind_address'])):
            lines=subprocess.check_output(['ss','-H','-ltn','sport = :'+str(port)],text=True).splitlines()
            assert len(lines)==1 and lines[0].split()[3]==address+':'+str(port),lines
        assert subprocess.check_output(['id','-nG','rufus-web'],text=True).strip()=='rufus-web'
        subprocess.run(['systemctl','is-active','--quiet','rufus','rufus-web','rufus-web-firewall'],check=True)
        subprocess.run(['systemctl','is-enabled','--quiet','rufus-web','rufus-web-firewall'],check=True)
        rules=subprocess.check_output(['nft','-s','list','table','inet','rufus_web'],text=True)
        assert 'ip saddr 192.168.0.0/24 tcp dport 8788 accept' in rules or ('ip saddr 192.168.0.0/24' in rules and 'tcp dport 8788' in rules)
        assert 'tcp dport 8788 drop' in rules
        for p in pathlib.Path('/opt/rufus-web/app').rglob('*'):
            assert p.stat().st_uid==0 and not p.stat().st_mode & 0o022,str(p)
        for path in ('/opt/rufus/config/secrets.txt','/var/lib/rundeck/.ssh/target_ed25519'):
            assert subprocess.run(['runuser','-u','rufus-web','--','test','-r',path]).returncode!=0
        try:urllib.request.urlopen('http://127.0.0.1:8787/conversations',timeout=5)
        except urllib.error.HTTPError as e:assert e.code==401
        else:raise AssertionError('API accepted unauthenticated access')
        print('PASS LAN-only Web binding; loopback bearer API; dedicated IPv4/IPv6 deny rules; enabled firewall; separate identity and protected files')
        PY
      args:
        executable: /bin/bash
      changed_when: false
      register: web_isolation

    - name: Report security evidence
      ansible.builtin.debug:
        var: web_isolation.stdout_lines

- name: Existing AI3 real local conversation and restart acceptance
  ansible.builtin.import_playbook: ai3-acceptance.yml
