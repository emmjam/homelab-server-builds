---
- name: Verify Rufus identity and source address from existing inventory hostname
  hosts: rufus_inference
  become: true
  gather_facts: true
  tasks:
    - name: Require intended Rufus host
      ansible.builtin.assert:
        that:
          - ansible_facts.hostname == 'rufus'
          - ansible_facts.default_ipv4.address is match('^192\.168\.0\.[0-9]+$')

- name: Adopt approved HP runtime and model without reinstalling
  hosts: ai_inference
  become: true
  gather_facts: true
  vars:
    ollama_rufus_ipv4: "{{ hostvars[groups['rufus_inference'][0]].ansible_facts.default_ipv4.address }}"
  roles:
    - ollama_inference

- name: Configure Rufus inference client without changing its API or permissions
  hosts: rufus_inference
  become: true
  gather_facts: false
  tags: [rufus_inference_client]
  vars_files:
    - ../vars/rufus-inference.yml
  tasks:
    - name: Install inference client module
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/../../Rufus/{{ item }}'
        dest: /opt/rufus/app/{{ item }}
        owner: root
        group: rufus
        mode: '0640'
      loop: [inference.py, budget.py]
      notify: Restart Rufus inference client

    - name: Install non-secret inference settings
      ansible.builtin.copy:
        dest: /opt/rufus/config/inference.json
        owner: root
        group: rufus
        mode: '0640'
        content: >-
          {{ {'url': 'http://ai-agent.lan:11434', 'model': 'qwen3:4b',
              'connect_timeout': rufus_inference_connect_timeout_seconds,
              'inference_timeout': rufus_structured_timeout_seconds,
              'chat_num_ctx': rufus_chat_context_tokens,
              'chat_num_predict': rufus_chat_generation_tokens,
              'chat_inference_timeout': rufus_chat_timeout_seconds,
              'chat_empty_thinking_prefill': true,
              'repository_context_tokens': rufus_repository_context_tokens,
              'context_framing_tokens': rufus_context_framing_tokens,
              'workflow_context_reserve_tokens': rufus_workflow_context_reserve_tokens,
              'incoming_message_tokens': rufus_incoming_message_tokens,
              'history_context_tokens': rufus_history_context_tokens,
              'auth_secret_name': none} | to_nice_json }}

      notify: Restart Rufus inference client
  handlers:
    - name: Restart Rufus inference client
      ansible.builtin.systemd_service:
        name: rufus
        state: restarted

- name: Run routine inference acceptance checks
  ansible.builtin.import_playbook: ai-inference-validate.yml
