---
- name: Inspect HP inference prerequisites without changing the host
  hosts: ai_inference
  become: false
  gather_facts: true
  gather_subset: [min, hardware, network, virtual]
  tasks:
    - name: Require the intended HP hostname
      ansible.builtin.assert:
        that: ansible_facts.hostname == 'ai-agent'
        fail_msg: Refusing inspection of an unexpected host.

    - name: Inspect GPU hardware without installing tools or drivers
      ansible.builtin.command: lspci -nn
      register: hp_pci
      changed_when: false
      failed_when: false

    - name: Inspect existing deployment privileges
      ansible.builtin.command: sudo -n -l
      register: hp_sudo
      changed_when: false
      failed_when: false

    - name: Inspect filesystem capacity
      ansible.builtin.command: df -B1 --output=target,size,avail /
      register: hp_disk
      changed_when: false

    - name: Inspect installed packages
      ansible.builtin.package_facts:
        manager: auto

    - name: Inspect service definitions
      ansible.builtin.service_facts:

    - name: Inspect common runtime and model locations
      ansible.builtin.stat:
        path: '{{ item }}'
      loop:
        - /usr/local/bin/ollama
        - /usr/bin/ollama
        - /usr/local/bin/llama-server
        - /usr/bin/llama-server
        - /usr/share/ollama/.ollama/models
        - /var/lib/ollama/models
      register: hp_runtime_paths

    - name: Report hardware and deployment prerequisites
      ansible.builtin.debug:
        msg:
          status: "{{ 'PASS' if hp_sudo.rc == 0 else 'WARN' }}"
          hostname: '{{ ansible_facts.hostname }}'
          os: '{{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}'
          architecture: '{{ ansible_facts.architecture }}'
          virtualisation: '{{ ansible_facts.virtualization_type | default("unknown") }}'
          processor: '{{ ansible_facts.processor }}'
          threads: '{{ ansible_facts.processor_vcpus }}'
          ram_mb: '{{ ansible_facts.memtotal_mb }}'
          available_ram_mb: '{{ ansible_facts.memfree_mb }}'
          filesystem: '{{ hp_disk.stdout_lines }}'
          addresses: '{{ ansible_facts.all_ipv4_addresses }}'
          gpu: '{{ hp_pci.stdout_lines | default([]) | select("search", "VGA|3D|Display") | list }}'
          pci_check_rc: '{{ hp_pci.rc }}'
          sudo_check_rc: '{{ hp_sudo.rc }}'
          sudo_permissions: '{{ hp_sudo.stdout_lines }}'
          runtime_packages: '{{ ansible_facts.packages.keys() | select("search", "ollama|llama|cuda|nvidia") | list }}'
          runtime_services: '{{ ansible_facts.services.keys() | select("search", "ollama|llama") | list }}'
          existing_runtime_paths: '{{ hp_runtime_paths.results | selectattr("stat.exists") | map(attribute="item") | list }}'
