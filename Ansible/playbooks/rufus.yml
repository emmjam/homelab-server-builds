---
- name: Configure Rufus AI management system
  hosts: rufus
  become: true
  gather_facts: true

  vars:
    rufus_rundeck_token: >-
      {{ lookup('ansible.builtin.pipe', 'python3 ' ~
         ((playbook_dir ~ '/../../Rundeck/scripts/read-secret.py') | quote) ~
         ' RUFUS_RUNDECK_TOKEN') }}
    rufus_api_token: >-
      {{ lookup('ansible.builtin.pipe', 'python3 ' ~
         ((playbook_dir ~ '/../../Rundeck/scripts/read-secret.py') | quote) ~
         ' RUFUS_API_TOKEN') }}
    rufus_home: /opt/rufus
    rufus_venv: /opt/rufus/venv
    rufus_directories:
      - /opt/rufus/app
      - /opt/rufus/config
      - /opt/rufus/data
      - /opt/rufus/logs

    install_ollama: false
    install_ollama_model: true
    ollama_model: qwen3:4b
    ollama_host: "127.0.0.1:11434"

    rufus_python_packages:
      - langgraph
      - langchain-ollama
      - langchain-openai
      - python-dotenv
      - requests

  pre_tasks:
    - name: Verify Debian 13
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == "Debian"
          - ansible_facts.distribution_major_version == "13"
        fail_msg: "Rufus requires Debian 13."

  tasks:
    # --------------------------------------------------
    # APT CONFIGURATION
    # --------------------------------------------------

    - name: Configure APT proxy
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/01proxy
        owner: root
        group: root
        mode: "0644"
        content: |
          Acquire::http::Proxy "http://192.168.0.101:3142";
          Acquire::https::Proxy "DIRECT";

    - name: Update APT cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    # --------------------------------------------------
    # SYSTEM DEPENDENCIES
    # --------------------------------------------------

    - name: Install system dependencies
      ansible.builtin.apt:
        name:
          - sudo
          - openssh-server
          - git
          - curl
          - wget
          - jq
          - rsync
          - vim
          - less
          - ca-certificates
          - python3
          - python3-venv
          - python3-pip
          - build-essential
        state: present

    - name: Read default editor selection
      ansible.builtin.command: update-alternatives --query editor
      register: rufus_editor_alternative
      changed_when: false

    - name: Set vi as the default editor
      ansible.builtin.command: update-alternatives --set editor /usr/bin/vim.basic
      when: "'Value: /usr/bin/vim.basic' not in rufus_editor_alternative.stdout_lines"
      changed_when: true

    # --------------------------------------------------
    # SSH SECURITY
    # --------------------------------------------------

    - name: Create SSH configuration directory
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Configure SSH authentication
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/00-homelab-hardening.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          PubkeyAuthentication yes
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin no
      notify: Restart SSH

    - name: Validate SSH configuration
      ansible.builtin.command: /usr/sbin/sshd -t
      changed_when: false

    # --------------------------------------------------
    # RUFUS SERVICE ACCOUNT
    # --------------------------------------------------

    - name: Create Rufus service account
      ansible.builtin.user:
        name: rufus
        home: "{{ rufus_home }}"
        shell: /usr/sbin/nologin
        system: true
        create_home: true
        state: present

    - name: Create Rufus directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: rufus
        group: rufus
        mode: "0750"
      loop: "{{ rufus_directories }}"

    # --------------------------------------------------
    # PYTHON ENVIRONMENT
    # --------------------------------------------------

    - name: Create Python virtual environment
      ansible.builtin.command:
        cmd: "python3 -m venv {{ rufus_venv }}"
        creates: "{{ rufus_venv }}/bin/python"

    - name: Install Rufus Python dependencies
      ansible.builtin.pip:
        name: "{{ rufus_python_packages }}"
        virtualenv: "{{ rufus_venv }}"
        state: present

    - name: Set Python environment ownership
      ansible.builtin.file:
        path: "{{ rufus_venv }}"
        state: directory
        owner: rufus
        group: rufus
        recurse: true

    # --------------------------------------------------
    # OLLAMA
    # --------------------------------------------------

    - name: Configure optional local inference
      when: install_ollama | bool
      block:
        - name: Download Ollama installer
          ansible.builtin.get_url:
            url: https://ollama.com/install.sh
            dest: /tmp/rufus-install-ollama.sh
            mode: "0700"

        - name: Install Ollama
          ansible.builtin.command:
            cmd: /tmp/rufus-install-ollama.sh
            creates: /usr/local/bin/ollama

        - name: Create Ollama service override directory
          ansible.builtin.file:
            path: /etc/systemd/system/ollama.service.d
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: Configure Ollama network binding
          ansible.builtin.copy:
            dest: /etc/systemd/system/ollama.service.d/override.conf
            owner: root
            group: root
            mode: "0644"
            content: |
              [Service]
              Environment="OLLAMA_HOST={{ ollama_host }}"
          notify:
            - Reload systemd
            - Restart Ollama

        - name: Enable and start Ollama
          ansible.builtin.systemd_service:
            name: ollama
            enabled: true
            state: started
            daemon_reload: true

        - name: Apply pending Ollama configuration
          ansible.builtin.meta: flush_handlers

        - name: Check installed Ollama models
          ansible.builtin.command:
            cmd: ollama list
          register: ollama_models
          changed_when: false
          when: install_ollama_model | bool

        - name: Install Qwen model
          ansible.builtin.command:
            cmd: "ollama pull {{ ollama_model }}"
          when:
            - install_ollama_model | bool
            - ollama_model not in ollama_models.stdout.split()
          changed_when: true

    - name: Deploy Rufus application
      tags: [rufus_application]
      block:
        - name: Install Rufus application modules
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../../Rufus/{{ item }}"
            dest: "{{ rufus_home }}/app/{{ item }}"
            owner: root
            group: rufus
            mode: "0640"
          loop: [app.py, config.py, rundeck.py]
          notify: Restart Rufus

        - name: Install approved job policy
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../../Rufus/policy.json"
            dest: "{{ rufus_home }}/config/policy.json"
            owner: root
            group: rufus
            mode: "0640"
          notify: Restart Rufus

        - name: Install Rufus configuration
          ansible.builtin.copy:
            dest: "{{ rufus_home }}/config/config.json"
            owner: root
            group: rufus
            mode: "0640"
            content: |
              {
                "rundeck_url": "http://192.168.0.51:4440",
                "request_timeout": 10,
                "port": 8787,
                "policy_file": "/opt/rufus/config/policy.json",
                "secrets_file": "/opt/rufus/config/secrets.txt",
                "database": "/opt/rufus/data/executions.sqlite3"
              }
          notify: Restart Rufus

        - name: Install only Rufus API credentials
          ansible.builtin.copy:
            dest: "{{ rufus_home }}/config/secrets.txt"
            owner: root
            group: rufus
            mode: "0640"
            content: |
              RUFUS_RUNDECK_TOKEN={{ rufus_rundeck_token | to_json }}
              RUFUS_API_TOKEN={{ rufus_api_token | to_json }}
          no_log: true
          notify: Restart Rufus

        - name: Install Rufus systemd service
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../../Rufus/rufus.service"
            dest: /etc/systemd/system/rufus.service
            owner: root
            group: root
            mode: "0644"
          register: rufus_service_unit
          notify: Restart Rufus

        - name: Enable Rufus service
          ansible.builtin.systemd_service:
            name: rufus
            enabled: true
            state: started
            daemon_reload: "{{ rufus_service_unit.changed }}"

  handlers:
    - name: Restart Rufus
      ansible.builtin.systemd_service:
        name: rufus
        state: restarted

    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Restart Ollama
      ansible.builtin.systemd_service:
        name: ollama
        state: restarted

    - name: Restart SSH
      ansible.builtin.systemd_service:
        name: ssh
        state: restarted
