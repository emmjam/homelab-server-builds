---
- name: Remove completed disposable APT-cache acceptance fixture
  hosts: apt_cache
  become: true
  gather_facts: false
  tags: [ai2_configuration]
  tasks:
    - name: Locate disposable fixture unit
      ansible.builtin.stat:
        path: /etc/systemd/system/apt-cache-ai2-fixture.service
      register: ai2_fixture_unit

    - name: Stop and disable disposable fixture before removal
      ansible.builtin.systemd_service:
        name: apt-cache-ai2-fixture
        state: stopped
        enabled: false
      when: ai2_fixture_unit.stat.exists

    - name: Remove only disposable fixture files
      ansible.builtin.file:
        path: '{{ item }}'
        state: absent
      loop:
        - /etc/systemd/system/apt-cache-ai2-fixture.service
        - /etc/homelab-ai2-fixture
        - /var/cache/apt-cacher-ng-ai2-fixture
        - /var/log/apt-cacher-ng-ai2-fixture
        - /run/apt-cache-ai2-fixture

    - name: Reload systemd after fixture removal
      ansible.builtin.systemd_service:
        daemon_reload: true

- name: Deploy application through existing Rufus application tasks
  ansible.builtin.import_playbook: rufus.yml

- name: Apply only approved restricted ACL additions
  hosts: rundeck_controller
  become: true
  gather_facts: false
  tags: [ai2_configuration]
  tasks:
    - name: Install approved health and fixed APT-cache job ACL
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/../../Rundeck/policies/rufus.aclpolicy'
        dest: /etc/rundeck/rufus.aclpolicy
        owner: rundeck
        group: rundeck
        mode: '0640'
