---
# HP: 8 GB RAM, CPU inference; loaded 4K context leaves ~4.25 GiB available.
# Qwen3's native 262K window is not an appropriate RAM/latency target here.
# History is bounded to six exchanges / 6000 characters before the system prompt.
rufus_chat_context_tokens: 8192
# The reproduced short question required 1107 reasoning+answer tokens.
rufus_chat_generation_tokens: 2048
# Measured ~6.9 tokens/s: allow the bounded output ceiling plus prompt/load time.
rufus_chat_timeout_seconds: 360
rufus_inference_connect_timeout_seconds: 5
# Preserve the existing AI2 structured-request timeout and 256-token allowance.
rufus_structured_timeout_seconds: 120
