# Run Ansible on Rundeck using the existing administrative execution context.
# Host keys belong in the separately verified managed_debian_known_hosts file.
[managed_debian]
rundeck ansible_connection=local ansible_python_interpreter=/usr/bin/python3
rufus.lan ansible_ssh_common_args='-o HostKeyAlias=rufus'
apt-cache.lan ansible_ssh_common_args='-o HostKeyAlias=apt-cache'

[managed_debian:vars]
ansible_user=rundeck
ansible_ssh_private_key_file=/var/lib/rundeck/.ssh/target_ed25519
ansible_ssh_extra_args=-o UserKnownHostsFile=/var/lib/rundeck/.ssh/managed_debian_known_hosts -o StrictHostKeyChecking=yes
