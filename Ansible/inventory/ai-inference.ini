# Run on Rundeck; trust existing host-key records, never bypass failed DNS.
[ai_inference]
ai-agent.lan ansible_ssh_common_args='-o HostKeyAlias=ai-agent' ansible_ssh_extra_args='-o UserKnownHostsFile=/var/lib/rundeck/.ssh/known_hosts -o StrictHostKeyChecking=yes'

[rufus_inference]
rufus.lan ansible_ssh_common_args='-o HostKeyAlias=rufus' ansible_ssh_extra_args='-o UserKnownHostsFile=/var/lib/rundeck/.ssh/managed_debian_known_hosts -o StrictHostKeyChecking=yes'

[all:vars]
ansible_user=rundeck
ansible_ssh_private_key_file=/var/lib/rundeck/.ssh/target_ed25519
