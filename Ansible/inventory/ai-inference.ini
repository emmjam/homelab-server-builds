# Run on Rundeck. Reuse the previously trusted ai-agent host-key record.
# Do not disable host-key checking or substitute an IP when DNS fails.
[ai_inference]
ai-agent.lan ansible_ssh_common_args='-o HostKeyAlias=ai-agent'

[ai_inference:vars]
ansible_user=rundeck
ansible_ssh_private_key_file=/var/lib/rundeck/.ssh/target_ed25519
ansible_ssh_extra_args=-o UserKnownHostsFile=/var/lib/rundeck/.ssh/known_hosts -o StrictHostKeyChecking=yes
